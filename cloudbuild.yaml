# cloudbuild.yaml
# Configuração para Cloud Build com Cloud Run
# VERSION: v1.7.0 | DATE: 2026-04-23 | AUTHOR: VeloHub Development Team
# CHANGELOG: v1.7.0 - GOOGLE_CLIENT_ID apenas via Secret GOOGLE_ID_CONSOLE; REACT_APP_API_URL via substituição _REACT_APP_API_URL
# CHANGELOG: v1.6.0 - Adicionado fallback para substituição direta caso Secret Manager não esteja acessível
#
# IMPORTANTE:
# - GOOGLE_ID_CONSOLE deve estar configurado no Secret Manager do GCP
# - REACT_APP_GOOGLE_CLIENT_ID é passada como build arg durante o build do Docker
# - Esta variável é incorporada no código JavaScript durante o build e não pode ser alterada em runtime

substitutions:
  _REACT_APP_API_URL: 'https://backend-gcp-278491073220.us-east1.run.app/api'
  _AUTHORIZED_DOMAIN: 'velotax.com.br'

steps:
  # Build da imagem Docker
  # REACT_APP_GOOGLE_CLIENT_ID é passada como build arg e incorporada no build do React
  # O valor vem do Secret Manager GOOGLE_ID_CONSOLE via availableSecrets
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "🔍 Verificando GOOGLE_CLIENT_ID..."
        if [ -z "$$GOOGLE_CLIENT_ID" ]; then
          echo "❌ ERRO: secret GOOGLE_ID_CONSOLE não disponível como GOOGLE_CLIENT_ID neste passo."
          exit 1
        fi
        echo "✅ GOOGLE_CLIENT_ID obtido do Secret Manager (primeiros 30 chars): $${GOOGLE_CLIENT_ID:0:30}..."
        CLIENT_ID="$$GOOGLE_CLIENT_ID"
        docker build \
          --build-arg REACT_APP_API_URL=${_REACT_APP_API_URL} \
          --build-arg REACT_APP_GOOGLE_CLIENT_ID="$CLIENT_ID" \
          --build-arg REACT_APP_AUTHORIZED_DOMAIN=${_AUTHORIZED_DOMAIN} \
          -t gcr.io/$PROJECT_ID/frontend-console:$COMMIT_SHA \
          -t gcr.io/$PROJECT_ID/frontend-console:latest \
          .
    id: 'build-image'
    secretEnv: ['GOOGLE_CLIENT_ID']
  
  # Push da imagem para Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/frontend-console:$COMMIT_SHA']
    id: 'push-image-sha'
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/frontend-console:latest']
    id: 'push-image-latest'
  
  # Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'frontend-console'
      - '--image'
      - 'gcr.io/$PROJECT_ID/frontend-console:$COMMIT_SHA'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'NODE_ENV=production'
    id: 'deploy-cloud-run'

images:
  - 'gcr.io/$PROJECT_ID/frontend-console:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/frontend-console:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Configurar acesso ao Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GOOGLE_ID_CONSOLE/versions/latest
      env: 'GOOGLE_CLIENT_ID'

timeout: '1200s'

